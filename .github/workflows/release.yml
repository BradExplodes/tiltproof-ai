name: Release

# Publishes a Windows installer + latest.yml to GitHub Releases when you push a
# version tag (e.g. `v0.1.0`). The tag MUST match desktop/package.json.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag to publish (e.g. v0.1.3). Only needed for manual runs."
                required: false
                type: string

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Resolve release tag
              id: tag
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
                    echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  else
                    echo "No release tag (push a v* tag or pass tag_name for manual runs)" >&2
                    exit 1
                  fi

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Build engine sidecar (PyInstaller)
              working-directory: engine
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[service]"
                  pip install pyinstaller
                  pyinstaller aicoach-server.spec --noconfirm --clean

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: desktop/package-lock.json

            # Build only — upload via action-gh-release. On tag pushes electron-builder
            # would otherwise auto-publish (needs GH_TOKEN) and fail without it.
            - name: Build desktop installer
              working-directory: desktop
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
              run: |
                  npm ci
                  npm run dist

            - name: Verify update metadata exists
              working-directory: desktop
              shell: bash
              run: |
                  ls -la release/
                  test -f release/latest.yml || (echo "latest.yml missing — auto-update will not work" && exit 1)
                  test -n "$(ls release/Tiltproof\ AI-Setup-*.exe 2>/dev/null)" || (echo "installer .exe missing" && exit 1)

            - name: Publish to GitHub Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.name }}
                  name: ${{ steps.tag.outputs.name }}
                  files: |
                      desktop/release/Tiltproof AI-Setup-*.exe
                      desktop/release/latest.yml
                      desktop/release/*.blockmap
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
